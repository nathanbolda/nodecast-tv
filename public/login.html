<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Bolda TV</title>
    <link rel="icon" type="image/png" href="/img/bolda-tv-icon.png">
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: var(--color-bg-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: var(--color-bg-secondary);
            padding: var(--space-2xl);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--color-border);
        }

        .login-logo {
            text-align: center;
            margin-bottom: var(--space-2xl);
        }

        .login-logo .logo-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto var(--space-md);
            color: var(--color-accent);
        }

        .login-logo h1 {
            font-family: 'Century Gothic', sans-serif;
            font-size: 28px;
            font-weight: 500;
            color: var(--color-text-primary);
            margin: 0;
        }

        .bolda-login-logo {
            display: block;
            width: min(280px, 80%);
            height: auto;
            margin: 0 auto var(--space-lg);
        }

        .login-logo p {
            color: var(--color-text-secondary);
            margin: 0;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: var(--space-lg);
        }

        .form-group label {
            display: block;
            margin-bottom: var(--space-sm);
            color: var(--color-text-primary);
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--color-bg-tertiary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            color: var(--color-text-primary);
            font-size: 15px;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-accent);
            background: var(--color-bg-hover);
        }

        .form-group input::placeholder {
            color: var(--color-text-muted);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--color-accent);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background: var(--color-accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: var(--color-error);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: var(--space-lg);
            border: 1px solid rgba(239, 68, 68, 0.2);
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .setup-message {
            background: rgba(99, 102, 241, 0.1);
            color: var(--color-accent);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: var(--space-lg);
            border: 1px solid var(--color-accent-dim);
            font-size: 14px;
            display: none;
        }

        .setup-message.show {
            display: block;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <img
                    src="/img/bolda-tv-logo.png"
                    alt="Bolda TV"
                    class="bolda-login-logo"
                >
                <p id="login-subtitle">Sign in to continue</p>
            </div>

            <div class="error-message" id="error-message"></div>
            <div class="setup-message" id="setup-message">
                Welcome! Please create your admin account to get started.
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                        placeholder="Enter your username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        minlength="6" placeholder="Enter your password">
                </div>

                <button type="submit" class="btn-login" id="submit-btn">Sign In</button>
            </form>

        </div>
    </div>
